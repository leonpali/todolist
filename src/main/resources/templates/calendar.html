<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Weekly Board</title>
	<link rel="stylesheet" th:href="@{/css/calendar.css}">
</head>
<body>

<header class="topbar">
	<h1>Weekly Board</h1>
	<nav class="week-nav" aria-label="Week">
		<a class="btn btn-icon" th:href="@{/(week=${prevWeek})}" title="Previous week" aria-label="Previous week">&lsaquo;</a>
		<a class="btn" th:href="@{/}" th:classappend="${isCurrentWeek} ? 'is-current'">Today</a>
		<a class="btn btn-icon" th:href="@{/(week=${nextWeek})}" title="Next week" aria-label="Next week">&rsaquo;</a>
		<div class="week-label">
			<span class="week-range" th:text="${weekRange}">5 Oct – 9 Oct 2026</span>
			<span class="week-number" th:text="'Week ' + ${weekNumber}">Week 41</span>
		</div>
		<form th:action="@{/}" method="get" class="inline">
			<input type="date" name="week" class="week-picker" th:value="${weekStart}"
				   onchange="if (this.value) this.form.submit()" title="Jump to the week of a date" aria-label="Jump to date">
		</form>
	</nav>
	<div class="topbar-actions">
		<button type="button" class="btn btn-primary" id="open-create">+ Create task</button>
		<span class="current-user" th:text="${currentUser}">user@example.com</span>
		<form th:action="@{/logout}" method="post" class="inline">
			<button type="submit" class="btn">Log out</button>
		</form>
	</div>
</header>

<main class="board">
	<section class="column" th:each="day : ${weekdays}" th:with="dayTasks=${tasksByDay.get(day)}"
			 th:classappend="${dayDates.get(day) == today} ? 'is-today'">
		<header class="column-header">
			<h2><span th:text="${dayNames.get(day)}">Monday</span>
				<span class="column-date" th:text="${dayDateLabels.get(day)}">5 Oct</span></h2>
			<span class="column-meta">
				<span class="count" th:text="${#lists.size(dayTasks)}">0</span>
				<span class="hours" th:if="${!#lists.isEmpty(dayTasks)}"
					  th:text="${#numbers.formatDecimal(#aggregates.sum(dayTasks.![estimatedHours]), 1, 1)} + 'h'">0h</span>
			</span>
		</header>
		<div class="column-body">
			<th:block th:each="task : ${dayTasks}">
				<article th:replace="~{fragments/task-card :: taskCard(${task})}"></article>
			</th:block>
			<p class="empty" th:if="${#lists.isEmpty(dayTasks)}">No tasks</p>
		</div>
	</section>
</main>

<dialog id="create-dialog" th:attr="data-open=${openCreateDialog}">
	<form th:action="@{/tasks}" th:object="${taskForm}" method="post" class="dialog-form">
		<h2>Create task</h2>
		<input type="hidden" name="week" th:value="${weekStart}">

		<label>Headline
			<input type="text" th:field="*{headline}" maxlength="120" required autofocus>
			<span class="error" th:if="${#fields.hasErrors('headline')}" th:errors="*{headline}"></span>
		</label>

		<label>Description
			<textarea th:field="*{description}" rows="4" maxlength="2000"></textarea>
			<span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
		</label>

		<div class="row">
			<label>Estimated time (hours)
				<input type="number" th:field="*{estimatedHours}" min="0.25" max="40" step="0.25" required>
				<span class="error" th:if="${#fields.hasErrors('estimatedHours')}" th:errors="*{estimatedHours}"></span>
			</label>
			<label>Date
				<input type="date" th:field="*{date}" required>
				<span class="error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
				<span class="error" th:if="${#fields.hasErrors('onWeekday')}" th:errors="*{onWeekday}"></span>
			</label>
			<label>Status
				<select th:field="*{status}">
					<option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}">To Do</option>
				</select>
			</label>
		</div>

		<div class="dialog-actions">
			<button type="button" class="btn" id="cancel-create">Cancel</button>
			<button type="submit" class="btn btn-primary">Create</button>
		</div>
	</form>
</dialog>

<script>
	const dialog = document.getElementById('create-dialog');
	document.getElementById('open-create').addEventListener('click', () => dialog.showModal());
	document.getElementById('cancel-create').addEventListener('click', () => dialog.close());
	if (dialog.dataset.open === 'true') dialog.showModal();

	function submitTaskDate(input) {
		if (!input.value) {
			input.value = input.defaultValue;
			return;
		}
		const day = new Date(input.value + 'T00:00:00').getDay();
		if (day === 0 || day === 6) {
			alert('Tasks can only be scheduled Monday to Friday.');
			input.value = input.defaultValue;
			return;
		}
		input.form.submit();
	}
</script>
</body>
</html>
