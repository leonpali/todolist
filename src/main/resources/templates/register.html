<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Create account · Weekly Board</title>
	<link rel="stylesheet" th:href="@{/css/calendar.css}">
</head>
<body class="auth-page">
<main class="auth-card">
	<h1>Weekly Board</h1>
	<form th:action="@{/register}" th:object="${registrationForm}" method="post" class="dialog-form">
		<h2>Create account</h2>

		<label>Email
			<input type="email" th:field="*{email}" maxlength="254" autocomplete="username" required autofocus>
			<span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
		</label>
		<label>Password
			<input type="password" name="password" maxlength="64" autocomplete="new-password" required>
			<span class="hint">8-64 characters with at least one letter and one digit.
				Allowed special characters: <code>! @ # $ % ^ &amp; * ( ) _ + = [ ] { } : , . ? ~ | / -</code></span>
			<span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
		</label>
		<label>Confirm password
			<input type="password" name="confirmPassword" maxlength="64" autocomplete="new-password" required>
			<span class="error" th:if="${#fields.hasErrors('passwordConfirmed')}" th:errors="*{passwordConfirmed}"></span>
		</label>

		<div class="dialog-actions">
			<button type="submit" class="btn btn-primary">Create account</button>
		</div>
		<p class="auth-switch">Already registered? <a th:href="@{/login}">Log in</a></p>
	</form>
</main>
</body>
</html>
