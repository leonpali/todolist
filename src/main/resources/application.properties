spring.application.name=javacalender
server.address=localhost

# --- HTTPS only: credentials never travel in plain text ---
# Dev uses a self-signed certificate generated with:
#   keytool -genkeypair -alias todolist -keyalg RSA -keysize 3072 -validity 825 -storetype PKCS12 \
#     -keystore src/main/resources/ssl/dev-keystore.p12 -storepass changeit \
#     -dname "CN=localhost" -ext "SAN=dns:localhost,ip:127.0.0.1"
# In production point SSL_KEY_STORE at a real certificate.
server.port=${PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEY_STORE:classpath:ssl/dev-keystore.p12}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:todolist}
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

app.security.require-https=true
app.security.bcrypt-strength=12

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/javacalender}
spring.datasource.username=${DB_USERNAME:javacalender}
spring.datasource.password=${DB_PASSWORD:javacalender}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

calendar.tasks.completed-retention=P1M
calendar.tasks.cleanup-cron=0 0 * * * *
