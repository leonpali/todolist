spring.application.name=javacalender

spring.datasource.url=jdbc:h2:mem:javacalender;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

calendar.tasks.completed-retention=P1M
calendar.tasks.cleanup-cron=-

# MockMvc requests are plain HTTP; HTTPS enforcement has its own test (HttpsEnforcementTests).
app.security.require-https=false
# Cheap BCrypt cost to keep tests fast; production uses 12.
app.security.bcrypt-strength=4
